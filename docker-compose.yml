services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15

  tests:
    build:
      context: .
      target: test
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment
      WEBHOOK_SECRET: change-me
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment
      WEBHOOK_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      tests:
        condition: service_completed_successfully
